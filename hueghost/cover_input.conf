# hue-ghost screen care - the black cover over a display nobody is using
# (default bindings are disabled; only these work)
# Hue Ghost takes it away by itself the moment the mouse or keyboard is
# touched. Clicking it or pressing Esc closes it too, should Hue Ghost ever
# not be there to.
MBTN_LEFT quit
MBTN_RIGHT quit
MBTN_MID quit
ESC quit
